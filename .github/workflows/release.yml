name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包插件（排除 .git / dist）
        run: |
          mkdir -p dist
          tar --exclude=.git --exclude=dist -czf "dist/voice-clone-${GITHUB_REF_NAME}.tar.gz" .
          ls -lh dist

      - name: 上传构建产物（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: voice-clone-package
          path: dist/*.tar.gz

      - name: 挂到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/voice-clone-*.tar.gz
